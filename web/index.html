<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Expense Splitter — Smart Group Expense Management System</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <!-- Chart.js for High Performance Financial Visualizations -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="app-container">
    <!-- Left Navigation Sidebar -->
    <aside class="sidebar">
      <!-- Brand Logo -->
      <div class="brand-header">
        <div class="brand-icon">⚡</div>
        <div>
          <div class="brand-title">ExpenseSplitter</div>
          <div class="brand-subtitle">Smart Group Finance</div>
        </div>
      </div>

      <!-- Navigation Links -->
      <nav class="nav-menu">
        <a class="nav-item active" id="nav-dashboard" onclick="setView('dashboard')">
          <span>📊</span>
          <span>Dashboard</span>
        </a>
        <a class="nav-item" id="nav-groups" onclick="setView('groups')">
          <span>👥</span>
          <span>My Groups</span>
        </a>
        <a class="nav-item" id="nav-add-expense" onclick="setView('add-expense')">
          <span>➕</span>
          <span>Add Expense</span>
        </a>
        <a class="nav-item" id="nav-expenses" onclick="setView('expenses')">
          <span>📑</span>
          <span>Expenses List</span>
        </a>
        <a class="nav-item" id="nav-balances" onclick="setView('balances')">
          <span>⚖️</span>
          <span>Balances &amp; Debts</span>
        </a>
        <a class="nav-item" id="nav-settlements" onclick="setView('settlements')">
          <span>🤝</span>
          <span>Settle Up</span>
        </a>
        <a class="nav-item" id="nav-reports" onclick="setView('reports')">
          <span>📈</span>
          <span>Reports &amp; Analytics</span>
        </a>
        <a class="nav-item" id="nav-notifications" onclick="setView('notifications')">
          <span>🔔</span>
          <span>Notifications</span>
          <span class="nav-badge" id="sidebar-notification-badge" style="display: none;">0</span>
        </a>
        <a class="nav-item" id="nav-settings" onclick="setView('settings')">
          <span>⚙️</span>
          <span>Settings</span>
        </a>
      </nav>

      <!-- Sidebar Footer: User Switcher & Theme Toggle -->
      <div class="sidebar-footer">
        <!-- Switch Account Simulator -->
        <div style="display: flex; flex-direction: column; gap: 4px;">
          <span style="font-size: 10px; font-weight: 700; color: var(--text-muted); text-transform: uppercase;">Switch Demo Perspective:</span>
          <select id="user-switch-select" class="form-control" style="padding: 6px 10px; font-size: 12px;" onchange="switchUser(this.value)">
            <option value="1">Rahul Sharma (Creditor / Admin)</option>
            <option value="2">Aman Verma (Debtor / Roommate)</option>
            <option value="3">Rohit Kumar (College Friend)</option>
            <option value="4">Priya Patel (Colleague)</option>
          </select>
        </div>

        <button class="btn btn-secondary" style="width: 100%; padding: 8px; font-size: 12px; justify-content: center;" onclick="toggleTheme()">
          🌓 Toggle Dark / Light Theme
        </button>

        <div class="user-profile-card">
          <div class="user-avatar" id="current-user-avatar">RS</div>
          <div class="user-info">
            <div class="user-name" id="current-user-name">Rahul Sharma</div>
            <div class="user-handle" id="current-user-handle">@rahul</div>
          </div>
        </div>
      </div>
    </aside>

    <!-- Main Dynamic Workspace -->
    <main class="main-content" id="view-container">
      <!-- Dynamic content rendered by app.js -->
    </main>
  </div>

  <!-- Reusable Application Modal Backdrop -->
  <div class="modal-overlay" id="app-modal">
    <div class="modal-box" id="modal-content">
      <!-- Injected modal content -->
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
